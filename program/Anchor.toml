[programs.devnet]
escrow = "5QzRtGsFnLRmmMPygmSf5HkLP4cKzNbyMBtM2zx4cS2n"

[programs.localnet]
escrow = "5QzRtGsFnLRmmMPygmSf5HkLP4cKzNbyMBtM2zx4cS2n"

