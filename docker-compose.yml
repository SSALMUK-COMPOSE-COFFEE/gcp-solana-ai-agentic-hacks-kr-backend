services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "8090:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      chain-svc:
        condition: service_started

  chain-svc:
    build: ./chain-svc
    env_file:
      - .env
    environment:
      PORT: ${CHAIN_SVC_PORT}
      AGENT_AUTHORITY_KEYPAIR: /run/secrets/agent-authority.json
    volumes:
      - ${HOME}/.keys/chongdae/agent-authority.json:/run/secrets/agent-authority.json:ro

volumes:
  dbdata:
